<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>Through the lens · luma.gl</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div id="scene" aria-label="An image shown as five vertical bands, one per compute stage"></div>
    <aside class="luma-example-infobox luma-example-infobox--overlay">
      <div class="eyebrow">LUMA.GL GPGPU</div>
      <h1>Through the lens</h1>
      <section class="control-card">
        <h2>Skyline node</h2>
        <label>
          <span>Edge threshold <span id="threshold-value">0.35</span></span>
          <input id="threshold" type="range" min="0.05" max="2" step="0.05" value="0.35">
        </label>
        <label>
          <span>Bring your own lens</span>
          <input id="photo" type="file" accept="image/*">
        </label>
      </section>
      <section class="control-card">
        <h2>Graph readout</h2>
        <pre id="readout" class="readout">Starting…</pre>
      </section>
      <div id="status" class="hint" role="status">Starting…</div>
      <p class="hint">
        Bands, left to right: image, luminance, blur, gradient, skyline. The test image is generated
        in the page; a photo you pick is read locally and never leaves it.
      </p>
    </aside>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
